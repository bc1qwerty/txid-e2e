name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # daily smoke against production *.txid.uk sites

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Suite targets live production https://*.txid.uk URLs only; no secrets,
      # no local servers required. Full suite re-enabled 2026-06-12 after the
      # refresh pass (stale 2026-03 specs updated to current site reality,
      # macro.spec.ts removed — site consolidated, NXDOMAIN).
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Silent-failure guard: schedule runs nobody watches must page.
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🔴 txid-e2e failed (from gha/${{ github.event_name }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
