name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # daily smoke against production *.txid.uk sites

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Suite targets live production https://*.txid.uk URLs only; no secrets,
      # no local servers required.
      - name: Run E2E tests
        run: npx playwright test
