name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *' # daily smoke against production *.txid.uk sites

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 브라우저를 캐시한다. 2026-08-19 에 이 단계가 30분을 매달려 job 타임아웃을
      # 통째로 먹었다 — 같은 날 learn.txid.uk·private-shop 도 같은 자리에서 걸렸으니
      # 리포별 설정 문제가 아니라 apt/CDN 이 나쁜 날로 읽힌다. 그리고 그런 날이야말로
      # **무인 야간 스모크가 견뎌야 하는 날**이다. 아무도 안 보고 있기 때문이다.
      # ⚠캐시 키는 package-lock.json 이고 GitHub 은 7일 미사용 엔트리를 evict 한다 —
      # 워크플로가 오래 죽어 있으면 캐시도 같이 사라져서, 복구 첫 실행은 항상 캐시
      # 미스로 시작한다(이번이 정확히 그 경우였다).
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # ⚠OS 의존 패키지(apt)는 **job 을 막지 못하게** 한다.
      # 2026-08-19 실측: 캐시는 적중했는데 `install-deps` 안의 `apt-get update` 가
      # `archive.ubuntu.com` 의 noble-security InRelease 에서 **29분** 매달려
      # job 타임아웃을 통째로 먹었다(같은 날 learn·private-shop·lib 도 동일).
      # GitHub 러너 이미지에는 Chromium 이 필요한 라이브러리가 이미 들어 있어서
      # `--with-deps` 는 사실상 맨 컨테이너용이다. 그래서 시도는 하되 실패·지연에
      # 관계없이 넘어간다 — 진짜로 라이브러리가 없으면 그 다음 테스트가 즉시,
      # 그리고 알아볼 수 있게 실패한다. 무인 야간 스모크가 apt 사정에 인질로
      # 잡히는 것보다 그게 낫다.
      - name: Install Playwright OS deps (best effort)
        continue-on-error: true
        timeout-minutes: 4
        run: npx playwright install-deps chromium
      # Suite targets live production https://*.txid.uk URLs only; no secrets,
      # no local servers required. Full suite re-enabled 2026-06-12 after the
      # refresh pass (stale 2026-03 specs updated to current site reality,
      # macro.spec.ts removed — site consolidated, NXDOMAIN).
      # map.spec.ts removed 2026-08-21 — map.txid.uk retired.
      - name: Run E2E tests
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # Silent-failure guard: schedule runs nobody watches must page.
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🔴 txid-e2e failed (from gha/${{ github.event_name }}): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
